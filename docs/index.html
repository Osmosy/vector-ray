<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vector Ray-Offline · как проходит один прогон</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    :root {
      --color-paper: #070d18;
      --color-panel: #0e1728;
      --color-ink: #e9f0fb;
      --color-muted: #9fb3d1;
      --color-soft: #6f84a6;
      --color-accent: #59b0ff;
      --color-rule: rgba(159,179,209,0.22);
      --font-sans: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      --font-serif: Georgia, 'Times New Roman', serif;
      --font-mono: ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, monospace;
      --motion-fast: 160ms;
      --motion-step: 480ms;
      --motion-hold: 720ms;
      --motion-total: 4320ms;
      --motion-ease: cubic-bezier(.2,.8,.2,1);
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 48px 24px;
      color: var(--color-ink);
      background: var(--color-paper);
      font-family: var(--font-sans);
    }
    [data-motion-root] { width: min(100%, 1200px); }
    .eyebrow {
      margin: 0 0 8px;
      color: var(--color-muted);
      font: 500 12px/1.4 var(--font-mono);
      letter-spacing: .18em;
      text-transform: uppercase;
    }
    h1 { margin: 0 0 8px; font: 400 32px/1.15 var(--font-serif); }
    .lede { margin: 0 0 24px; max-width: 76ch; color: var(--color-muted); font: 400 15px/1.6 var(--font-sans); }
    svg { display: block; width: 100%; min-width: 720px; }

    /* Статичный кадр полон. Прячет элементы только включённая анимация. */
    .motion-ready [data-motion-item] {
      opacity: .14;
      transform: translateY(8px);
      transform-box: fill-box;
      transform-origin: center;
      transition: opacity var(--motion-step) var(--motion-ease),
                  transform var(--motion-step) var(--motion-ease);
    }
    .motion-ready [data-motion-item].is-visible,
    .motion-ready[data-frame="end"] [data-motion-item],
    .motion-ready[data-frame="static"] [data-motion-item] {
      opacity: 1;
      transform: none;
    }
    .motion-ready [data-motion-item].is-current .node-box { stroke: var(--color-accent); }
    .draw-path {
      fill: none;
      stroke: var(--color-accent);
      stroke-width: 3;
      stroke-dasharray: 1;
      stroke-dashoffset: 1;
      pointer-events: none;
    }
    .motion-ready .draw-path.is-visible {
      animation: draw-path var(--motion-step) linear forwards;
    }
    .flow-token { opacity: 0; pointer-events: none; }
    .motion-ready.is-playing .flow-token.is-visible {
      opacity: 1;
      animation: token-flow 3.2s linear 1 forwards;
    }
    .motion-ready[data-motion-mode="loop"].is-playing .flow-token.is-visible {
      animation-iteration-count: infinite;
    }
    @keyframes draw-path { to { stroke-dashoffset: 0; } }
    @keyframes token-flow {
      0% { transform: translateX(0); }
      100% { transform: translateX(240px); }
    }

    [data-motion-controls] {
      display: none;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid var(--color-rule);
    }
    .motion-ready [data-motion-controls] { display: flex; }
    [data-motion-controls][hidden] { display: none !important; }
    [data-motion-controls] button {
      min-width: 44px;
      min-height: 44px;
      padding: 8px 12px;
      border: 1px solid var(--color-muted);
      border-radius: 4px;
      color: var(--color-ink);
      background: var(--color-panel);
      font: 600 12px/1 var(--font-sans);
      cursor: pointer;
    }
    [data-motion-controls] button:hover { border-color: var(--color-accent); }
    [data-motion-controls] button:focus-visible {
      outline: 3px solid var(--color-accent);
      outline-offset: 2px;
    }
    [data-motion-controls] button:disabled { cursor: not-allowed; opacity: .45; }
    [data-motion-status-visible] {
      margin-left: auto;
      color: var(--color-muted);
      font: 500 12px/1.4 var(--font-mono);
    }
    .keyboard-help { color: var(--color-soft); font: 500 12px/1.4 var(--font-mono); }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0,0,0,0);
      white-space: nowrap;
      border: 0;
    }
    noscript p {
      margin: 12px 0 0;
      color: var(--color-muted);
      font: 500 12px/1.4 var(--font-mono);
    }

    html[data-motion="static"] [data-motion-controls],
    html[data-motion="static"] [data-motion-decorative] { display: none !important; }
    html[data-motion="static"] [data-motion-item] {
      opacity: 1 !important;
      transform: none !important;
      animation: none !important;
      transition: none !important;
    }
    html[data-motion="step"] [data-motion-controls],
    html[data-motion="step"] [data-motion-decorative] { display: none !important; }
    html[data-motion="step"] [data-motion-item] {
      animation: none !important;
      transition: none !important;
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .001ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: .001ms !important;
      }
      [data-motion-item] { opacity: 1 !important; transform: none !important; }
      [data-motion-decorative] { display: none !important; }
      [data-motion-controls] { display: none !important; }
    }
    @media print {
      [data-motion-controls], [data-motion-decorative] { display: none !important; }
      [data-motion-item] {
        opacity: 1 !important;
        transform: none !important;
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <main data-motion-root data-motion-mode="step" data-step-count="6" data-step-current="6" data-frame="static" data-static-frame="complete">
    <p class="eyebrow">Vector Ray-Offline · один прогон</p>
    <h1>От документа до отчёта</h1>
    <p class="lede">Шесть шагов одного прогона: интерфейс, локальная модель и граф знаний. Нажмите «Воспроизвести», чтобы пройти по шагам, или «Далее», чтобы переключать вручную.</p>

    <svg viewBox="0 0 1200 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="vector-ray-motion-title vector-ray-motion-desc">
      <title id="vector-ray-motion-title">Шесть шагов прогона Vector Ray-Offline</title>
      <desc id="vector-ray-motion-desc">Документ проходит через онтологию, граф знаний в Neo4j, генерацию персонажей, раунды симуляции и отчёт агента; интерфейс, модель и граф работают на одной машине.</desc>
      <defs>
        <marker id="vector-ray-motion-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#9fb3d1"/>
        </marker>
      </defs>
      <rect width="1200" height="520" fill="#070d18"/>

      <!-- Постоянные связи несут статический смысл и видны всегда. -->
      <path d="M195 230 H237" fill="none" stroke="#9fb3d1" marker-end="url(#vector-ray-motion-arrow)"/>
      <path d="M387 230 H429" fill="none" stroke="#9fb3d1" marker-end="url(#vector-ray-motion-arrow)"/>
      <path d="M579 230 H621" fill="none" stroke="#9fb3d1" marker-end="url(#vector-ray-motion-arrow)"/>
      <path d="M771 230 H813" fill="none" stroke="#9fb3d1" marker-end="url(#vector-ray-motion-arrow)"/>
      <path d="M963 230 H1005" fill="none" stroke="#9fb3d1" marker-end="url(#vector-ray-motion-arrow)"/>

      <g data-motion-item data-step="1" aria-label="Шаг 1: документ загружен">
        <rect class="node-box" x="45" y="170" width="150" height="120" rx="8" fill="#0e1728" stroke="#3d5378"/>
        <text x="120" y="209" text-anchor="middle" fill="#e9f0fb" font-family="system-ui, sans-serif" font-size="15" font-weight="600">Документ</text>
        <text x="120" y="233" text-anchor="middle" fill="#9fb3d1" font-family="ui-monospace, monospace" font-size="11">PDF · MD · TXT</text>
        <text x="120" y="259" text-anchor="middle" fill="#6f84a6" font-family="ui-monospace, monospace" font-size="10">до 50 МБ</text>
      </g>

      <g data-motion-item data-step="2" aria-label="Шаг 2: модель предложила онтологию">
        <rect class="node-box" x="237" y="170" width="150" height="120" rx="8" fill="#0e1728" stroke="#3d5378"/>
        <text x="312" y="209" text-anchor="middle" fill="#e9f0fb" font-family="system-ui, sans-serif" font-size="15" font-weight="600">Онтология</text>
        <text x="312" y="233" text-anchor="middle" fill="#9fb3d1" font-family="ui-monospace, monospace" font-size="11">типы сущностей</text>
        <text x="312" y="259" text-anchor="middle" fill="#6f84a6" font-family="ui-monospace, monospace" font-size="10">правится вручную</text>
      </g>

      <g data-motion-item data-step="3" aria-label="Шаг 3: граф построен в Neo4j">
        <rect class="node-box" x="429" y="170" width="150" height="120" rx="8" fill="#0e1728" stroke="#3d5378"/>
        <text x="504" y="209" text-anchor="middle" fill="#e9f0fb" font-family="system-ui, sans-serif" font-size="15" font-weight="600">Граф</text>
        <text x="504" y="233" text-anchor="middle" fill="#9fb3d1" font-family="ui-monospace, monospace" font-size="11">NER/RE → Neo4j</text>
        <text x="504" y="259" text-anchor="middle" fill="#6f84a6" font-family="ui-monospace, monospace" font-size="10">0.7 вектор + 0.3 BM25</text>
      </g>

      <g data-motion-item data-step="4" aria-label="Шаг 4: сгенерированы персонажи">
        <rect class="node-box" x="621" y="170" width="150" height="120" rx="8" fill="#0e1728" stroke="#3d5378"/>
        <text x="696" y="209" text-anchor="middle" fill="#e9f0fb" font-family="system-ui, sans-serif" font-size="15" font-weight="600">Персонажи</text>
        <text x="696" y="233" text-anchor="middle" fill="#9fb3d1" font-family="ui-monospace, monospace" font-size="11">характер · влияние</text>
        <text x="696" y="259" text-anchor="middle" fill="#6f84a6" font-family="ui-monospace, monospace" font-size="10">память о прошлом</text>
      </g>

      <g data-motion-item data-step="5" aria-label="Шаг 5: прошли раунды симуляции">
        <rect class="node-box" x="813" y="170" width="150" height="120" rx="8" fill="#0e1728" stroke="#3d5378"/>
        <text x="888" y="209" text-anchor="middle" fill="#e9f0fb" font-family="system-ui, sans-serif" font-size="15" font-weight="600">Симуляция</text>
        <text x="888" y="233" text-anchor="middle" fill="#9fb3d1" font-family="ui-monospace, monospace" font-size="11">раунды OASIS</text>
        <text x="888" y="259" text-anchor="middle" fill="#6f84a6" font-family="ui-monospace, monospace" font-size="10">действия → в граф</text>
      </g>

      <g data-motion-item data-step="6" aria-label="Шаг 6: готов отчёт">
        <rect class="node-box" x="1005" y="170" width="150" height="120" rx="8" fill="#0e1728" stroke="#3d5378"/>
        <text x="1080" y="209" text-anchor="middle" fill="#e9f0fb" font-family="system-ui, sans-serif" font-size="15" font-weight="600">Отчёт</text>
        <text x="1080" y="233" text-anchor="middle" fill="#9fb3d1" font-family="ui-monospace, monospace" font-size="11">граф-поиск · интервью</text>
        <text x="1080" y="259" text-anchor="middle" fill="#6f84a6" font-family="ui-monospace, monospace" font-size="10">секции и выводы</text>
      </g>

      <!-- Постоянная подпись: смысл не зависит от анимации. -->
      <line x1="45" y1="360" x2="1155" y2="360" stroke="rgba(159,179,209,0.22)" stroke-width="1"/>
      <text x="45" y="392" fill="#9fb3d1" font-family="system-ui, sans-serif" font-size="13">Каждый шаг пишет результат в файлы прогона и в граф — следующий шаг читает уже сохранённое.</text>
      <text x="45" y="424" fill="#6f84a6" font-family="ui-monospace, monospace" font-size="12" letter-spacing="0.04em">ЛОКАЛЬНО: OLLAMA · NEO4J · ФАЙЛЫ ПРОГОНА — НИ ОДНОГО ВНЕШНЕГО ЗАПРОСА</text>
      <text x="45" y="452" fill="#6f84a6" font-family="ui-monospace, monospace" font-size="12">порты: 3000 интерфейс · 5001 API · 7474 и 7687 Neo4j</text>

      <!-- Декоративный токен не несёт уникального смысла. -->
      <circle data-motion-item data-step="5" data-motion-decorative aria-hidden="true" focusable="false" class="flow-token" cx="813" cy="230" r="6" fill="#59b0ff"/>
    </svg>

    <div data-motion-controls role="group" aria-label="Управление воспроизведением диаграммы">
      <button type="button" data-motion-action="prev">Назад</button>
      <button type="button" data-motion-action="play" aria-pressed="false">Воспроизвести</button>
      <button type="button" data-motion-action="pause" aria-pressed="true">Пауза</button>
      <button type="button" data-motion-action="next">Далее</button>
      <button type="button" data-motion-action="replay">Заново</button>
      <span class="keyboard-help">←/→ шаг · Space пуск/пауза · R заново · Home/End в начало и конец</span>
      <span data-motion-status-visible aria-hidden="true">Шаг <span data-motion-step-label>6</span> из 6</span>
    </div>
    <p class="sr-only" data-motion-status role="status" aria-live="polite" aria-atomic="true"></p>
    <noscript><p>Для управления нужен JavaScript. Полная схема показана выше.</p></noscript>
  </main>

  <script data-diagram-controls>
    (() => {
      const params = new URLSearchParams(location.search);
      const staticOverride = params.get('motion') === 'static' || document.documentElement.dataset.motion === 'static';
      const requestedStep = params.get('step');
      const reduce = matchMedia('(prefers-reduced-motion: reduce)');
      document.fonts.ready.then(() => { document.documentElement.dataset.fontsReady = 'true'; });

      document.querySelectorAll('[data-motion-root]').forEach((root) => {
        const count = Number(root.dataset.stepCount);
        const hold = parseFloat(getComputedStyle(root).getPropertyValue('--motion-hold')) || 720;
        const parsedStep = requestedStep !== null && /^\d+$/.test(requestedStep) ? Number(requestedStep) : null;
        const exactStep = params.get('motion') === 'step' && Number.isSafeInteger(parsedStep) && parsedStep >= 0 && parsedStep <= count ? parsedStep : null;
        const items = [...root.querySelectorAll('[data-motion-item]')];
        const labels = Array.from({ length: count + 1 }, (_, index) => index === 0
          ? 'Ready'
          : items.filter((item) => !item.hasAttribute('data-motion-decorative') && Number(item.dataset.step) === index)
              .map((item) => item.getAttribute('aria-label')).join('; '));
        const controls = root.querySelector('[data-motion-controls]');
        const status = root.querySelector('[data-motion-status]');
        const visibleStep = root.querySelector('[data-motion-step-label]');
        let step = count;
        let timer = 0;
        let playing = false;
        let stepBeforeReduce = 0;
        let resumeAfterReduce = root.dataset.motionMode === 'reveal';

        const buttons = (action) => controls.querySelector(`[data-motion-action="${action}"]`);
        const clearClock = () => { window.clearTimeout(timer); timer = 0; };
        const announce = () => { status.textContent = `Step ${step} of ${count}: ${labels[step] || 'Complete'}`; };
        const setControlsAvailable = (available) => {
          controls.hidden = !available;
          controls.setAttribute('aria-hidden', String(!available));
          controls.dataset.playbackDisabled = String(!available);
          controls.querySelectorAll('button').forEach((control) => { control.disabled = !available; });
        };

        function render(next, userInitiated = false) {
          step = Math.max(0, Math.min(count, next));
          root.dataset.stepCurrent = String(step);
          root.dataset.frame = step === count ? 'end' : step === 0 ? 'start' : 'step';
          items.forEach((item) => {
            const itemStep = Number(item.dataset.step);
            item.classList.toggle('is-visible', itemStep <= step);
            item.classList.toggle('is-current', itemStep === step);
          });
          if (visibleStep) visibleStep.textContent = String(step);
          const unavailable = controls.dataset.playbackDisabled === 'true';
          buttons('prev').disabled = unavailable || step === 0;
          buttons('next').disabled = unavailable || step === count;
          if (userInitiated) announce();
        }

        function pause(userInitiated = false) {
          clearClock();
          playing = false;
          root.classList.remove('is-playing');
          buttons('play').setAttribute('aria-pressed', 'false');
          buttons('pause').setAttribute('aria-pressed', 'true');
          if (userInitiated) status.textContent = `Paused at step ${step} of ${count}`;
        }

        function finish() {
          pause(false);
          root.dataset.frame = 'end';
          status.textContent = `Complete · step ${count} of ${count}`;
        }

        function tick() {
          if (!playing) return;
          if (step >= count) { finish(); return; }
          render(step + 1, false);
          if (step >= count) { finish(); return; }
          timer = window.setTimeout(tick, hold);
        }

        function play(fromStart = false, userInitiated = false) {
          clearClock();
          if (fromStart || step >= count) render(0, userInitiated);
          playing = true;
          root.classList.add('is-playing');
          buttons('play').setAttribute('aria-pressed', 'true');
          buttons('pause').setAttribute('aria-pressed', 'false');
          timer = window.setTimeout(tick, hold);
        }

        controls.addEventListener('click', (event) => {
          const button = event.target.closest('[data-motion-action]');
          if (!button) return;
          const action = button.dataset.motionAction;
          if (action === 'play') play(false, true);
          if (action === 'pause') pause(true);
          if (action === 'replay') play(true, true);
          if (action === 'prev') { pause(false); render(step - 1, true); }
          if (action === 'next') { pause(false); render(step + 1, true); }
        });

        root.addEventListener('keydown', (event) => {
          if (event.target.matches('input, textarea, select, a[href]')) return;
          const keys = { ArrowLeft: step - 1, ArrowRight: step + 1, Home: 0, End: count };
          if (event.code === 'Space' && !event.target.closest('button')) {
            event.preventDefault();
            playing ? pause(true) : play(false, true);
            return;
          }
          if (!event.ctrlKey && !event.metaKey && !event.altKey && event.key.toLowerCase() === 'r') {
            event.preventDefault();
            play(true, true);
            return;
          }
          if (!(event.key in keys)) return;
          event.preventDefault();
          pause(false);
          render(keys[event.key], true);
        });

        document.addEventListener('visibilitychange', () => {
          if (document.visibilityState === 'hidden' && playing) pause(false);
        });
        reduce.addEventListener('change', (event) => {
          if (event.matches && root.dataset.motionState !== 'reduced') {
            stepBeforeReduce = step;
            resumeAfterReduce = playing;
          }
          pause(false);
          if (event.matches) {
            setControlsAvailable(false);
            render(count, false);
            root.dataset.frame = 'static';
            root.dataset.motionState = 'reduced';
            status.textContent = 'Reduced motion · complete static frame · playback controls unavailable';
          } else if (staticOverride || root.dataset.motionMode === 'none') {
            setControlsAvailable(false);
            render(count, false);
            root.dataset.frame = 'static';
            root.dataset.motionState = 'static';
            status.textContent = 'Static frame · complete diagram · playback controls unavailable';
          } else {
            delete root.dataset.motionState;
            if (exactStep !== null) {
              setControlsAvailable(false);
              render(exactStep, false);
              root.dataset.frame = 'step';
              root.dataset.motionState = 'test';
              status.textContent = `Test frame · step ${step} of ${count} · playback controls unavailable`;
            } else {
              setControlsAvailable(true);
              render(stepBeforeReduce, false);
              status.textContent = `Ready · step ${step} of ${count}`;
              if (resumeAfterReduce && root.dataset.motionMode === 'reveal') {
                play(false, false);
              }
            }
            resumeAfterReduce = false;
          }
        });

        if (staticOverride) {
          document.documentElement.dataset.motion = 'static';
          pause(false);
          setControlsAvailable(false);
          render(count, false);
          root.dataset.frame = 'static';
          root.dataset.motionState = 'static';
          status.textContent = 'Static frame · complete diagram · playback controls unavailable';
        } else if (reduce.matches || root.dataset.motionMode === 'none') {
          pause(false);
          setControlsAvailable(false);
          render(count, false);
          root.dataset.frame = 'static';
          root.dataset.motionState = reduce.matches ? 'reduced' : 'static';
          status.textContent = reduce.matches
            ? 'Reduced motion · complete static frame · playback controls unavailable'
            : 'Static frame · complete diagram · playback controls unavailable';
        } else if (exactStep !== null) {
          document.documentElement.dataset.motion = 'step';
          pause(false);
          setControlsAvailable(false);
          render(exactStep, false);
          root.dataset.frame = 'step';
          root.dataset.motionState = 'test';
          status.textContent = `Test frame · step ${step} of ${count} · playback controls unavailable`;
        } else if (root.dataset.motionMode === 'reveal') {
          setControlsAvailable(true);
          render(0, false);
          play(false, false);
        } else {
          pause(false);
          setControlsAvailable(true);
          render(0, false);
          status.textContent = `Ready · step 0 of ${count}`;
        }
        root.classList.add('motion-ready');
      });
    })();
  </script>
</body>
</html>
